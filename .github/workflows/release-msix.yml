name: Release & Distribute MSIX to WinGet

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Decode Signing Certificate
      shell: pwsh
      run: |
        $bytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
        [System.IO.File]::WriteAllBytes("$pwd\SigningCert.pfx", $bytes)

    - name: Restore NuGet Packages
      run: |
        dotnet restore CharCounterWPF/CharCounterWPF.csproj -r win-x64

    - name: Build & Package MSIX
      shell: pwsh
      run: |
        msbuild CharCounter.Package/CharCounter.Package.wapproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:AppxBundle=Never `
          /p:AppxPackageDir="$pwd\AppPackages" `
          /p:AppxPackageOutput="$pwd\AppPackages\CharCounter-1.0.0.msix" `
          /p:PackageCertificateKeyFile="$pwd\SigningCert.pfx" `
          /p:PackageCertificatePassword="${{ secrets.CERTIFICATE_PASSWORD }}" `
          /p:AppxPackageSigningEnabled=true `
          /p:AppxPackageVersion=1.0.0.0 `
          /r

    - name: Create GitHub Release & Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: AppPackages/CharCounter-1.0.0.msix
        name: CharCounter ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Submit to WinGet (Continuous Updates)
      shell: pwsh
      run: |
        wingetcreate update RMALabs.CharCounter `
          --version "${{ github.ref_name }}" `
          --urls "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/CharCounter-1.0.0.msix" `
          --token "${{ secrets.WINGET_TOKEN }}"
      continue-on-error: true