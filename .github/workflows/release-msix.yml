name: Release & Distribute MSIX to WinGet

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract Versions
        id: get_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $cleanVersion = $rawTag.TrimStart('v')
          $msixVersion = "$cleanVersion.0"
          echo "VERSION=$cleanVersion" >> $env:GITHUB_OUTPUT
          echo "MSIX_VERSION=$msixVersion" >> $env:GITHUB_OUTPUT

      - name: Decode Signing Certificate
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [IO.File]::WriteAllBytes("SigningCert.pfx", $pfxBytes)

      - name: Build and Package MSIX
        shell: pwsh
        run: |
          msbuild CharCounter.Package/CharCounter.Package.wapproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$pwd\AppPackages" `
            /p:AppxPackageOutput="$pwd\AppPackages\CharCounter-${{ steps.get_version.outputs.VERSION }}.msix" `
            /p:PackageCertificateKeyFile="$pwd\SigningCert.pfx" `
            /p:PackageCertificatePassword="${{ secrets.CERTIFICATE_PASSWORD }}" `
            /p:AppxPackageSigningEnabled=true `
            /p:AppxPackageVersion=${{ steps.get_version.outputs.MSIX_VERSION }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: AppPackages/CharCounter-${{ steps.get_version.outputs.VERSION }}.msix

      - name: Submit Package to WinGet Repository
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/CharCounter-$version.msix"

          dotnet tool install --global wingetcreate

          wingetcreate update RMALabs.CharCounter `
            --version $version `
            --urls $installerUrl `
            --token $env:WINGET_TOKEN `
            --submit